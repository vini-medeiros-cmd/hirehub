# Nginx na frente do HireHub.
#
# Oracle Linux 9 / RHEL (não tem sites-available; o include é conf.d/*.conf):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/hirehub.conf
#
# Debian / Ubuntu:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hirehub
#   sudo ln -s /etc/nginx/sites-available/hirehub /etc/nginx/sites-enabled/
#
# Depois, nos dois:
#   sudo certbot --nginx -d hirehub.com.br -d www.hirehub.com.br
#   sudo nginx -t && sudo systemctl reload nginx
#
# O certbot reescreve este arquivo acrescentando o bloco 443 e o redirecionamento.
#
# ATENÇÃO NO ORACLE LINUX: o SELinux vem "enforcing" e bloqueia as duas coisas
# que este arquivo faz — conectar no Python da porta 8080 e ler os estáticos de
# /opt. Sem os dois comandos do README (o booleano httpd_can_network_connect e
# o contexto httpd_sys_content_t), o site responde 502 e os estáticos, 403.

server {
    listen 80;
    listen [::]:80;
    server_name hirehub.com.br www.hirehub.com.br;

    access_log /var/log/nginx/hirehub.access.log;
    error_log  /var/log/nginx/hirehub.error.log;

    # Compressão fica aqui, não no Python. As páginas são HTML puro e comprimem
    # muito bem — a listagem cai de ~20 KB para ~4 KB.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 512;

    # Estáticos servidos pelo Nginx, sem passar pelo processo Python. As fontes
    # e o CSS têm cache longo porque só mudam com um deploy.
    location /static/ {
        alias /opt/hirehub/web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
